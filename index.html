
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f7f3">
<title>水仙</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: #f8f7f3;
  color: #343b43;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
}

.app {
  height: 100%;
  max-width: 650px;
  margin: auto;
  display: flex;
  flex-direction: column;
  background: #f8f7f3;
}

header {
  padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
  background: rgba(255,255,255,.92);
  border-bottom: 1px solid #ecebe6;
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: #e5edf0;
  display: grid;
  place-items: center;
  font-size: 23px;
}

.header-info {
  flex: 1;
}

.header-info strong {
  display: block;
  font-size: 17px;
}

.header-info small {
  color: #8a9c9e;
  font-size: 12px;
  margin-top: 3px;
  display: block;
}

.status {
  width: 8px;
  height: 8px;
  background: #82b9a2;
  border-radius: 50%;
  margin-right: 5px;
  display: inline-block;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 22px 15px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.message-row {
  display: flex;
  width: 100%;
}

.message-row.user {
  justify-content: flex-end;
}

.message-row.assistant {
  justify-content: flex-start;
}

.bubble {
  max-width: 82%;
  padding: 11px 15px;
  border-radius: 19px;
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user .bubble {
  background: #dceaf0;
  border-bottom-right-radius: 6px;
  color: #344b58;
}

.assistant .bubble {
  background: #ffffff;
  border: 1px solid #eeede8;
  border-bottom-left-radius: 6px;
  color: #3e454a;
}

.time {
  text-align: center;
  font-size: 11px;
  color: #a5a6a1;
  margin: 5px 0;
}

.typing {
  display: none;
  align-self: flex-start;
  background: white;
  border: 1px solid #eeede8;
  border-radius: 18px;
  padding: 12px 16px;
  gap: 4px;
}

.typing.show {
  display: flex;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #9baeb4;
  animation: bounce 1s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}

footer {
  padding: 12px 13px calc(12px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.96);
  border-top: 1px solid #ecebe6;
}

.input-area {
  display: flex;
  align-items: flex-end;
  gap: 9px;
  max-width: 100%;
}

#messageInput {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  max-height: 120px;
  resize: none;
  border: 1px solid #e7e8e5;
  border-radius: 23px;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.4;
  outline: none;
  background: #f8f8f6;
  color: #343b43;
  font-family: inherit;
}

#messageInput:focus {
  border-color: #b7ccd4;
}

#sendButton {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: #9bb9c5;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

#sendButton:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.welcome {
  margin: auto;
  text-align: center;
  color: #929b9d;
  font-size: 14px;
  line-height: 1.8;
}

.welcome .flower {
  font-size: 35px;
  margin-bottom: 8px;
}
</style>
</head>

<body>
<div class="app">

  <header>
    <div class="avatar">🌼</div>
    <div class="header-info">
      <strong>水仙</strong>
      <small><span class="status"></span>在线</small>
    </div>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <div class="flower">🌼</div>
      <div>嗨，今天想聊点什么？</div>
    </div>
  </main>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>

  <footer>
    <div class="input-area">
      <textarea
        id="messageInput"
        placeholder="发消息给水仙..."
        rows="1"
      ></textarea>
      <button id="sendButton" aria-label="发送">↑</button>
    </div>
  </footer>

</div>

<script>
const API_URL =
  "https://shuixian.blattwadsworth.workers.dev/chat";

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const typing = document.getElementById("typing");
const welcome = document.getElementById("welcome");

let history = [];
let sending = false;

  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });
}
