
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f7f3">
<title>水仙</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  height: 100dvh;
  background: #f8f7f3;
  color: #35414a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  height: 100%;
  max-width: 650px;
  margin: auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(13px + env(safe-area-inset-top)) 17px 13px;
  background: #fff;
  border-bottom: 1px solid #ecece8;
}

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #e5eef0;
  display: grid;
  place-items: center;
  font-size: 23px;
}

.header-info {
  flex: 1;
}

.header-info strong {
  font-size: 17px;
}

.header-info small {
  display: block;
  color: #8ba5a7;
  margin-top: 4px;
  font-size: 12px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.welcome {
  margin: auto;
  text-align: center;
  color: #929b9d;
  line-height: 1.8;
  font-size: 14px;
}

.welcome div:first-child {
  font-size: 36px;
}

.message-row {
  display: flex;
  width: 100%;
}

.message-row.user {
  justify-content: flex-end;
}

.message-row.assistant {
  justify-content: flex-start;
}

.bubble {
  max-width: 84%;
  padding: 11px 15px;
  border-radius: 19px;
  font-size: 15px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user .bubble {
  background: #dceaf0;
  color: #354b57;
  border-bottom-right-radius: 6px;
}

.assistant .bubble {
  background: #fff;
  border: 1px solid #eeede8;
  color: #41474b;
  border-bottom-left-radius: 6px;
}

.typing {
  display: none;
  align-self: flex-start;
  margin: 0 14px 10px;
  padding: 12px 16px;
  gap: 5px;
  background: #fff;
  border: 1px solid #eeede8;
  border-radius: 18px;
}

.typing.show {
  display: flex;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #9bb9c5;
  animation: bounce 1s infinite;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}

footer {
  background: #fff;
  border-top: 1px solid #ecece8;
  padding: 12px 13px calc(12px + env(safe-area-inset-bottom));
}

.input-area {
  display: flex;
  align-items: flex-end;
  gap: 9px;
}

#messageInput {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  max-height: 120px;
  resize: none;
  border: 1px solid #e5e8e5;
  border-radius: 23px;
  padding: 12px 16px;
  background: #f8f8f6;
  color: #35414a;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.4;
  outline: none;
}

#messageInput:focus {
  border-color: #b5cbd3;
}

#sendButton {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border: none;
  border-radius: 50%;
  background: #9bb9c5;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

#sendButton:disabled {
  opacity: .5;
}
</style>
</head>

<body>
<div class="app">

  <header>
    <div class="avatar">🌼</div>
    <div class="header-info">
      <strong>水仙</strong>
      <small>● 在线</small>
    </div>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <div>🌼</div>
      今天想聊点什么？
    </div>
  </main>

  <div class="typing" id="typing">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <footer>
    <div class="input-area">
      <textarea
        id="messageInput"
        placeholder="发消息给水仙..."
        rows="1"
      ></textarea>
      <button id="sendButton" type="button">↑</button>
    </div>
  </footer>

</div>

<script>
"use strict";

const API_URL =
  "https://shuixian.blattwadsworth.workers.dev/chat";

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const typing = document.getElementById("typing");

let history = [];
let sending = false;

function scrollToBottom() {
  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });
}

function addMessage(role, text) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const row = document.createElement("div");
  row.className = "message-row " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = String(text);

  row.appendChild(bubble);
  chat.appendChild(row);

  scrollToBottom();
}

function autoResize() {
  input.style.height = "auto";
  input.style.height =
    Math.min(input.scrollHeight, 120) + "px";
}

input.addEventListener("input", autoResize);
