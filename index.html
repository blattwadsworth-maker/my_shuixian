
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>水仙</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100dvh;
  background: #f5f5f7;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
}

.app {
  max-width: 600px;
  height: 100%;
  margin: auto;
  display: flex;
  flex-direction: column;
  background: #f5f5f7;
}

header {
  padding: max(12px, env(safe-area-inset-top)) 18px 12px;
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid #e5e5ea;
  text-align: center;
  position: relative;
}

.avatar {
  width: 44px;
  height: 44px;
  margin: 0 auto 5px;
  border-radius: 50%;
  background: linear-gradient(135deg,#dce8ff,#b8c9f5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

h1 {
  font-size: 17px;
  margin: 0;
  font-weight: 650;
}

.status {
  font-size: 11px;
  color: #8e8e93;
  margin-top: 4px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 13px;
  scroll-behavior: smooth;
}

.welcome {
  text-align: center;
  margin: 75px 15px;
  color: #8e8e93;
  line-height: 2;
  font-size: 14px;
}

.message-row {
  display: flex;
  width: 100%;
  margin: 9px 0;
  align-items: flex-end;
}

.ai-row {
  justify-content: flex-start;
}

.user-row {
  justify-content: flex-end;
}

.message {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 19px;
  font-size: 16px;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.ai {
  background: #e5e5ea;
  color: #111;
  border-bottom-left-radius: 5px;
}

.user {
  background: #007aff;
  color: white;
  border-bottom-right-radius: 5px;
}

.ai-row + .ai-row {
  margin-top: 4px;
}

.input-area {
  padding: 11px 12px max(14px,env(safe-area-inset-bottom));
  background: rgba(255,255,255,.96);
  border-top: 1px solid #e5e5ea;
}

.input-row {
  display: flex;
  gap: 9px;
  align-items: flex-end;
}

textarea {
  flex: 1;
  resize: none;
  border: 1px solid #d1d1d6;
  background: white;
  color: #111;
  border-radius: 22px;
  padding: 11px 15px;
  font-size: 16px;
  outline: none;
  min-height: 44px;
  max-height: 110px;
  font-family: inherit;
}

textarea:focus {
  border-color: #007aff;
}

button {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border: none;
  border-radius: 50%;
  background: #007aff;
  color: white;
  font-size: 23px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

button:disabled {
  opacity: .45;
}

.hint {
  text-align: center;
  font-size: 10px;
  color: #aaa;
  margin-top: 7px;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="avatar">🌼</div>
  <h1>水仙</h1>
  <div class="status" id="status">● 在线</div>
</header>

<main class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div style="font-size:38px">🌷</div>
    <div>水仙</div>
    <div>今天想聊点什么？</div>
  </div>
</main>

<div class="input-area">
  <div class="input-row">
    <textarea
      id="input"
      placeholder="iMessage"
      rows="1"
    ></textarea>
    <button id="send" aria-label="发送">↑</button>
  </div>
  <div class="hint">水仙 · 私人聊天空间</div>
</div>

</div>

<script>
const API_URL =
  "https://shuixian.blattwadsworth.workers.dev/chat";

const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");
const statusEl = document.getElementById("status");

const history = [];

function addMessage(text, role) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const row = document.createElement("div");
  row.className = "message-row " +
    (role === "user" ? "user-row" : "ai-row");

  const bubble = document.createElement("div");
  bubble.className = "message " + role;
  bubble.textContent = text;

  row.appendChild(bubble);
  messagesEl.appendChild(row);

  messagesEl.scrollTop = messagesEl.scrollHeight;

  return bubble;
}

function addAssistantReply(text) {
  const parts = text
    .split(/\n+/)
    .map(part => part.trim())
    .filter(Boolean);

  if (parts.length === 0) {
    addMessage(text, "ai");
    return;
  }

  parts.forEach(part => {
    addMessage(part, "ai");
  });
}

async function send() {
  const text = input.value.trim();

  if (!text || sendButton.disabled) return;

  addMessage(text, "user");

  input.value = "";
  input.style.height = "44px";

  history.push({
    role: "user",
    content: text
  });

  sendButton.disabled = true;
  statusEl.textContent = "● 正在输入…";

  const waiting = addMessage("……", "ai");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: history
      })
    });

    const data = await response.json();
