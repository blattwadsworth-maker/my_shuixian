<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171421">
<title>水仙 · 私人空间</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#171421;color:#f5efff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 height:100dvh;display:flex;justify-content:center;
}
.app{width:100%;max-width:600px;display:flex;flex-direction:column;height:100%}
header{padding:22px 18px 16px;border-bottom:1px solid #383044}
h1{font-size:23px;margin:0 0 6px;letter-spacing:2px}
.subtitle{font-size:12px;color:#aaa0b9}
.status{color:#c7a8ed;font-size:12px;margin-top:9px}
.messages{flex:1;overflow-y:auto;padding:22px 16px}
.welcome{text-align:center;margin:65px 15px;color:#bdb1cc;line-height:1.9}
.flower{font-size:38px;margin-bottom:12px}
.message{max-width:82%;padding:12px 15px;border-radius:17px;margin:12px 0;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ai{background:#30283c;border:1px solid #493b58;margin-right:auto}
.user{background:#7554a0;margin-left:auto}
.input-area{padding:12px 14px 22px;background:#211c2c;border-top:1px solid #383044}
.input-row{display:flex;gap:9px}
textarea{flex:1;resize:none;border:1px solid #554667;background:#30283c;color:white;border-radius:14px;padding:13px;font-size:15px;outline:none;min-height:48px;max-height:110px}
button{border:0;border-radius:14px;background:#a77bd0;color:#20152b;font-size:15px;font-weight:bold;padding:0 19px}
.hint{text-align:center;font-size:11px;color:#8f849c;margin-top:9px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>✦ 水仙</h1>
<div class="subtitle">一个只属于你的私人空间</div>
<div class="status">● 私人对话空间 · 已准备好</div>
</header>
<main class="messages" id="messages">
<div class="welcome" id="welcome">
<div class="flower">🌙</div>
<div>欢迎回来。</div>
<div>我是水仙。</div>
<div>今天想和我聊些什么？</div>
</div>
</main>
<div class="input-area">
<div class="input-row">
<textarea id="input" placeholder="对水仙说些什么……" rows="1"></textarea>
<button id="send">发送</button>
</div>
<div class="hint">水仙 · 你的私人聊天空间</div>
</div>
</div>
<script>
const input=document.getElementById('input');
const messages=document.getElementById('messages');
function send(){
 const text=input.value.trim();
 if(!text)return;
 document.getElementById('welcome')?.remove();
 const bubble=document.createElement('div');
 bubble.className='message user';
 bubble.textContent=text;
 messages.appendChild(bubble);
 input.value='';
 messages.scrollTop=messages.scrollHeight;
 const reply=document.createElement('div');
 reply.className='message ai';
 reply.textContent='我收到你的话了。再给我一点时间，我们很快就能接入真正的 AI 对话能力。';
 messages.appendChild(reply);
 messages.scrollTop=messages.scrollHeight;
}
document.getElementById('send').addEventListener('click',send);
input.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();send();
 }
});
</script>
</body>
</html>
