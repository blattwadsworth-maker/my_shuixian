<style>

<body>

<header>
<h1>✦ 水仙</h1>
<div class="subtitle">一个只属于你的私人空间</div>
<div class="status">● 私人对话空间 · 已准备好</div>
</header>

<main class="messages" id="messages">
<div class="welcome" id="welcome">
<div class="flower">🌙</div>
<div>欢迎回来。</div>
<div>我是水仙。</div>
<div>今天想和我聊些什么？</div>
</div>
</main>

<div class="input-area">
<div class="input-row">
<textarea id="input" placeholder="对水仙说些什么……" rows="1"></textarea>
<button id="send">发送</button>
</div>
<div class="hint">水仙 · 你的私人聊天空间</div>
</div>

</div>

<script>
const API_URL = "https://shuixian.blattwadsworth.workers.dev/chat";

// 本地聊天记录存储名称
const STORAGE_KEY = "shuixian_chat_history_v1";

const input = document.getElementById("input");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("send");

// 所有聊天记录
let savedMessages = [];

// AI 对话上下文
let history = [];

// 保存聊天记录到手机
function saveMessages(){

 try{
  // 最多保存最近500条消息
  savedMessages = savedMessages.slice(-500);

  localStorage.setItem(
   STORAGE_KEY,
   JSON.stringify(savedMessages)
  );

 }catch(error){
  console.error("保存聊天记录失败：",error);
 }
}

// 从手机恢复聊天记录
function loadMessages(){

 try{

  const data = localStorage.getItem(STORAGE_KEY);

  if(!data) return;

  const parsed = JSON.parse(data);

  if(!Array.isArray(parsed)) return;

  savedMessages = parsed;

  // 恢复聊天上下文，只取成功完成的对话
  history = savedMessages
   .filter(item => item.context === true)
   .slice(-20)
   .map(item => ({
    role:item.type === "user" ? "user" : "assistant",
    content:item.text
   }));

  // 隐藏欢迎页面
  if(savedMessages.length > 0){
   document.getElementById("welcome")?.remove();
  }

  // 恢复所有聊天气泡
  savedMessages.forEach(item=>{
   addMessage(item.text,item.type);
  });

 }catch(error){

  console.error("恢复聊天记录失败：",error);

 }

}

// 添加聊天消息
function addMessage(text,type){

 const bubble = document.createElement("div");

 bubble.className = "message " + type;
 bubble.textContent = text;

 messages.appendChild(bubble);
 messages.scrollTop = messages.scrollHeight;

 return bubble;
}

// 发送消息

 const text = input.value.trim();

 if(!text || sendButton.disabled) return;

 document.getElementById("welcome")?.remove();

 // 显示用户消息
 addMessage(text,"user");

 // 保存用户消息
 const userRecord = {
  text:text,
  type:"user",
  context:false
 };

 savedMessages.push(userRecord);
 saveMessages();

 input.value = "";
 sendButton.disabled = true;

 // 加入 AI 对话上下文
 history.push({
  role:"user",
  content:text
 });

 const requestHistory = history.slice(-20);

 const loading = addMessage("正在想……","ai");

 try{

  const response = await fetch(API_URL,{
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    messages:requestHistory
   })
  });

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error || "请求失败，请稍后再试");
  }

  if(typeof data.reply !== "string" || !data.reply.trim()){
   throw new Error("没有收到有效的 AI 回复");
  }

  // 移除等待提示
  loading.remove();

  // 显示 AI 回复
  addMessage(data.reply,"ai");
