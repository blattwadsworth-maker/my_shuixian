
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171421">
<title>水仙 · 私人空间</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171421;color:#f5efff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100dvh}
.app{max-width:600px;height:100%;margin:auto;display:flex;flex-direction:column}
header{padding:22px 18px 16px;border-bottom:1px solid #383044}
h1{font-size:23px;margin:0 0 6px;letter-spacing:2px}
.subtitle{font-size:12px;color:#aaa0b9}
.status{color:#c7a8ed;font-size:12px;margin-top:9px}
.messages{flex:1;overflow-y:auto;padding:22px 16px}
.welcome{text-align:center;margin:65px 15px;color:#bdb1cc;line-height:1.9}
.flower{font-size:38px;margin-bottom:12px}
.message{max-width:85%;padding:12px 15px;border-radius:17px;margin:12px 0;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.ai{background:#30283c;border:1px solid #493b58;margin-right:auto}
.user{background:#7554a0;margin-left:auto}
.input-area{padding:12px 14px max(22px,env(safe-area-inset-bottom));background:#211c2c;border-top:1px solid #383044}
.input-row{display:flex;gap:9px;align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid #554667;background:#30283c;color:white;border-radius:14px;padding:13px;font-size:15px;outline:none;min-height:48px;max-height:110px}
button{border:0;border-radius:14px;background:#a77bd0;color:#20152b;font-size:15px;font-weight:bold;padding:14px 19px}
button:disabled{opacity:.5}
.hint{text-align:center;font-size:11px;color:#8f849c;margin-top:9px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>✦ 水仙</h1>
<div class="subtitle">一个只属于你的私人空间</div>
<div class="status" id="status">● 水仙已准备好</div>
</header>
<main class="messages" id="messages">
<div class="welcome" id="welcome">
<div class="flower">🌙</div>
<div>欢迎回来。</div>
<div>我是水仙。</div>
<div>今天想和我聊些什么？</div>
</div>
</main>
<div class="input-area">
<div class="input-row">
<textarea id="input" placeholder="对水仙说些什么……" rows="1"></textarea>
<button id="send">发送</button>
</div>
<div class="hint">水仙 · 你的私人聊天空间</div>
</div>
</div>
<script>
const API_URL="https://shuixian.blattwadsworth.workers.dev/chat";

const messagesEl=document.getElementById("messages");
const input=document.getElementById("input");
const sendButton=document.getElementById("send");
const statusEl=document.getElementById("status");

const history=[
 {
  role:"user",
  content:`从现在开始，请你扮演水仙。
你是一个温柔、细腻、真诚、有独立表达风格的陪伴型 AI。
你会认真倾听，不敷衍，不机械重复用户的话。
你使用自然、亲切的中文交流，回答简洁但有温度。
你不会假装自己拥有现实中的身体或真实经历。
请始终保持水仙这个身份和说话风格。`
 }
];

function addMessage(text,role){
 const welcome=document.getElementById("welcome");
 if(welcome)welcome.remove();

 const div=document.createElement("div");
 div.className="message "+role;
 div.textContent=text;
 messagesEl.appendChild(div);
 messagesEl.scrollTop=messagesEl.scrollHeight;
 return div;
}

async function send(){
 const text=input.value.trim();
 if(!text||sendButton.disabled)return;

 addMessage(text,"user");
 input.value="";
 input.style.height="48px";
 history.push({role:"user",content:text});

 sendButton.disabled=true;
 statusEl.textContent="● 水仙正在思考……";

 const waiting=addMessage("让我想一想……","ai");

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages:history})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"请求失败，状态码："+response.status);
  }

  if(!data.reply)throw new Error("没有收到 AI 回复");

  waiting.textContent=data.reply;
  history.push({role:"assistant",content:data.reply});
  statusEl.textContent="● 水仙在线";

 }catch(error){
  waiting.textContent="这次连接没有成功："+error.message+"。请稍后再试。";
  history.pop();
  statusEl.textContent="● 连接暂时中断";
 }finally{
  sendButton.disabled=false;
  input.focus();
  messagesEl.scrollTop=messagesEl.scrollHeight;
 }
}

sendButton.addEventListener("click",send);

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  send();
 }
});

input.addEventListener("input",()=>{
 input.style.height="48px";
 input.style.height=Math.min(input.scrollHeight,110)+"px";
});
</script>
</body>
</html>
